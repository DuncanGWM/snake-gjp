<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="GJP MRP WBP stylized background">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#133252"/>
      <stop offset="100%" stop-color="#081b2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#5da8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5da8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <g text-anchor="middle" dominant-baseline="middle"
     font-family="Arial Black, Inter, Helvetica, Arial, sans-serif"
     font-size="320" font-weight="800" letter-spacing="18"
     fill="#ffffff" fill-opacity="0.09" filter="url(#softText)">
    <text x="50%" y="22%">GJP</text>
    <text x="50%" y="50%">MRP</text>
    <text x="50%" y="78%">WBP</text>
  </g>
</svg>
